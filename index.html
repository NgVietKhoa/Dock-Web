<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Dock Web</title>
<style>
  :root { color-scheme:light dark; --bg:#1e1f22; --bar:#2b2d31; --tool:#3a3c42; --tab:#383a40; --act:#4e5058; --fg:#e6e6e6; --mute:#9a9ca3; --acc:#5865f2;
          --pop:#2b2d31; --hov:#34363b; --line:#3a3c42; --edge:#1a1b1e; --shadow:rgba(0,0,0,.45); }
  /* Light theme. ⋯ → Theo hệ thống / Sáng / Tối sets nativeTheme.themeSource in main → this media query follows it (like Chrome) */
  @media (prefers-color-scheme: light) {
    :root { --bg:#f1f3f4; --bar:#e3e6ea; --tool:#ffffff; --tab:#d8dce1; --act:#ccd1d7; --fg:#1f1f1f; --mute:#5f6368;
            --pop:#ffffff; --hov:#d9dde2; --line:#c4c8cd; --edge:#dadce0; --shadow:rgba(0,0,0,.18); }
  }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--fg); font:13px "Segoe UI", system-ui, sans-serif; overflow:hidden; }
  body { border:1px solid var(--line); }
  #app { display:flex; flex-direction:column; height:100%; }

  button { display:inline-flex; align-items:center; justify-content:center; background:var(--tab); color:var(--fg); border:0; border-radius:6px; padding:3px 7px; cursor:pointer; font:inherit; line-height:18px; }
  button:hover { background:var(--act); }
  button.on { background:var(--acc); color:#fff; }
  [hidden] { display:none !important; }

  /* Icons: <svg class="ic"><use href="#i-…"></svg> from the sprite at the top of <body>; stroke follows the text color */
  .ic { width:16px; height:16px; flex:none; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }

  /* Row 1 (like Chrome): tabs + window buttons. Empty space = handle for dragging the window */
  #bar { display:flex; align-items:center; gap:4px; height:36px; padding:4px 6px 0; background:var(--bar); flex:none; -webkit-app-region:drag; user-select:none; }
  /* Only buttons/tabs are no-drag → gaps between tabs, after the + button… can all be grabbed */
  #bar button, .tab { -webkit-app-region:no-drag; }
  #grab, #add, .win { margin-bottom:4px; }
  #grab { display:flex; color:var(--mute); padding:2px 6px; cursor:move; }
  #bar button { background:transparent; }
  #bar button:hover { background:var(--tab); }
  #bar button.on { background:var(--acc); }
  #bar #close:hover { background:#da373c; color:#fff; }
  #tabs { display:flex; align-self:stretch; gap:2px; overflow-x:auto; flex:0 1 auto; min-width:0; scrollbar-width:none; }
  #tabs::-webkit-scrollbar { display:none; }
  /* container-type ignores the content when sizing → state the natural width (220px minus padding) or #tabs collapses */
  .tab { container-type:inline-size; contain-intrinsic-inline-size:204px; display:flex; align-items:center; gap:6px; flex:0 1 220px; min-width:32px; padding:0 8px; border-radius:8px 8px 0 0; cursor:pointer; white-space:nowrap; }
  .tab:hover { background:var(--hov); }
  .tab.on { background:var(--tool); }
  .tab .fav { flex:none; display:flex; width:16px; height:16px; color:var(--mute); }
  /* The title fades out at the end like Chrome instead of "…" */
  .tab span { flex:1; min-width:0; overflow:hidden; -webkit-mask-image:linear-gradient(to right, #000 calc(100% - 18px), transparent); }
  .tab b { display:flex; color:var(--mute); padding:2px; border-radius:4px; }
  .tab b:hover { color:var(--fg); background:var(--act); }
  .tab b .ic { width:12px; height:12px; }
  .tab .snd { display:none; color:var(--mute); }
  .tab .snd:hover { color:var(--fg); }
  .tab .snd .ic { width:14px; height:14px; }
  .tab.audible .snd, .tab.muted .snd { display:flex; }
  /* Crowded tabs shrink in steps (sizes = tab width minus padding): the title shortens → inactive tabs drop × →
     only the favicon is left (the active tab shows × instead). At 32px the bar starts scrolling */
  @container (max-width: 72px) { .tab:not(.on) b { display:none; } }
  @container (max-width: 40px) {
    .tab span, .tab:is(.audible, .muted) .snd, .tab.on .fav { display:none; }
    .tab .fav, .tab b { margin:0 auto; }
  }
  .win { display:flex; gap:2px; margin-left:auto; }

  /* Row 2: ← → ⟳ + address bar */
  #nav { display:flex; align-items:center; gap:2px; padding:4px 6px; background:var(--tool); flex:none; }
  #nav button { width:28px; height:28px; padding:0; border-radius:50%; background:transparent; }
  #nav button:hover { background:var(--act); }
  #nav button:disabled { opacity:.35; cursor:default; background:transparent; }
  .omni { display:flex; align-items:center; gap:2px; flex:1; min-width:0; height:30px; margin-left:4px; padding:0 3px 0 12px; background:var(--bg); border:1px solid transparent; border-radius:15px; }
  .omni:focus-within { border-color:var(--acc); }
  #url { flex:1; min-width:0; padding:0; background:transparent; color:var(--fg); border:0; outline:none; font:inherit; }
  #nav .omni button { width:24px; height:24px; }
  #nav #zoom { width:auto; padding:0 8px; border-radius:12px; color:var(--mute); font-size:12px; }
  #star.on { color:#f5c518; }
  #star.on .ic { fill:currentColor; }

  #views { position:relative; flex:1; border-top:1px solid var(--edge); }
  webview { position:absolute; inset:0; width:100%; height:100%; visibility:hidden; }
  webview.on { visibility:visible; }
  #empty { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; color:var(--mute); text-align:center; padding:16px; line-height:1.6; }

  /* Find-in-page bar (Ctrl+F) */
  #find { position:absolute; top:6px; right:10px; z-index:5; display:none; align-items:center; gap:4px; padding:4px; background:var(--pop); border:1px solid var(--tab); border-radius:6px; box-shadow:0 6px 18px var(--shadow); }
  #find.on { display:flex; }
  #find button .ic { width:14px; height:14px; }
  #findIn { width:160px; background:var(--bg); color:var(--fg); border:1px solid var(--tab); border-radius:4px; padding:2px 6px; outline:none; }
  #findIn:focus { border-color:var(--acc); }
  #findN { min-width:36px; color:var(--mute); font-size:12px; text-align:center; }

  #corner { position:fixed; right:0; bottom:0; width:16px; height:16px; z-index:20; cursor:nwse-resize;
    background:linear-gradient(135deg, transparent 55%, var(--mute) 55%, var(--mute) 62%, transparent 62%, transparent 75%, var(--mute) 75%, var(--mute) 82%, transparent 82%); }
  #overlay, #shield { position:fixed; inset:0; z-index:30; display:none; -webkit-app-region:no-drag; }
  #overlay { background:rgba(88,101,242,.25); border:3px dashed var(--acc); align-items:center; justify-content:center; font-size:18px; }
  #overlay.on { display:flex; }
  #shield.on { display:block; cursor:nwse-resize; }

  /* Suggestions under the address bar: typed text, history, Google search suggestions */
  #sug { position:fixed; z-index:25; display:none; overflow-y:auto; padding:3px; background:var(--pop); border:1px solid var(--tab); border-radius:6px; box-shadow:0 6px 18px var(--shadow); -webkit-app-region:no-drag; }
  #sug.on { display:block; }
  #sug div { display:flex; align-items:center; gap:8px; padding:4px 8px; border-radius:4px; cursor:pointer; white-space:nowrap; }
  #sug div.sel, #sug div:hover { background:var(--act); }
  #sug i { flex:none; display:flex; justify-content:center; width:18px; color:var(--mute); }
  #sug i .ic { width:14px; height:14px; }
  #sug .ti { flex:0 1 auto; min-width:0; overflow:hidden; text-overflow:ellipsis; }
  #sug .u { flex:1 1 0; min-width:0; overflow:hidden; text-overflow:ellipsis; color:var(--mute); }
  #sug .u:not(:empty) { min-width:30%; }
  #sug b { flex:none; display:flex; margin-left:auto; padding:2px; color:var(--mute); }
  #sug b:hover { color:var(--fg); }
  #sug b .ic { width:14px; height:14px; }

  /* Bookmarks bar (like Chrome) — shown only when there is at least 1 bookmark */
  #marks { display:none; align-items:center; gap:2px; padding:0 6px 4px; background:var(--tool); flex:none; overflow:hidden; -webkit-app-region:drag; user-select:none; }
  #marks.on { display:flex; }
  /* » at the end of the bar: bookmarks that don't fit (like Chrome) */
  #marksMore { flex:none; margin-left:auto; width:24px; height:24px; padding:0; border-radius:50%; background:transparent; color:var(--mute); -webkit-app-region:no-drag; }
  #marksMore:hover { background:var(--tab); color:var(--fg); }
  .mark { display:flex; align-items:center; gap:6px; max-width:170px; padding:3px 8px; border-radius:12px; cursor:pointer; white-space:nowrap; flex:none; -webkit-app-region:no-drag; }
  .mark:hover { background:var(--tab); }
  .mark i { flex:none; display:flex; align-items:center; justify-content:center; width:16px; height:16px; color:var(--mute); }
  .mark i .ic { width:14px; height:14px; }
  .mark span { overflow:hidden; text-overflow:ellipsis; outline:none; }
  .mark span[contenteditable] { background:var(--bg); padding:0 4px; border-radius:3px; text-overflow:clip; }

  /* Shared popup menu: ⋯, tab right-click, bookmark right-click */
  #menu { position:fixed; z-index:26; display:none; min-width:170px; max-height:calc(100vh - 8px); overflow-y:auto; padding:3px; background:var(--pop); border:1px solid var(--tab); border-radius:6px; box-shadow:0 6px 18px var(--shadow); -webkit-app-region:no-drag; user-select:none; }
  #menu.on { display:block; }
  #menu .mi { display:flex; align-items:center; gap:8px; padding:4px 10px 4px 6px; border-radius:4px; cursor:pointer; white-space:nowrap; }
  #menu .mi:hover { background:var(--act); }
  #menu .mi i { display:flex; justify-content:center; width:18px; color:var(--mute); }
  #menu .mi .chk { width:14px; height:14px; color:var(--acc); stroke-width:3; }
  #menu .mi span { max-width:320px; overflow:hidden; text-overflow:ellipsis; }
  #menu .mi small { margin-left:auto; padding-left:16px; color:var(--mute); font-size:11px; }
  #menu hr { margin:3px 4px; border:0; border-top:1px solid var(--tab); }
  #menu label { display:flex; align-items:center; gap:8px; padding:4px 10px 4px 32px; white-space:nowrap; }
  #menu input[type=range] { width:90px; }

  #ghost { position:fixed; left:8px; bottom:8px; z-index:40; display:none; padding:4px 10px; border-radius:6px; background:rgba(0,0,0,.75); color:#fff; font-size:12px; pointer-events:none; }
  body.ghost #ghost { display:flex; align-items:center; gap:6px; }
  #ghost .ic { width:14px; height:14px; }
  body.ghost #corner { display:none; }
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute">

<div id="app">
  <div id="bar">
    <span id="grab" title="Nắm chỗ này (hoặc chỗ trống trên thanh) để kéo cửa sổ"><svg class="ic"><use href="#i-grip"/></svg></span>
    <div id="tabs"></div>
    <button id="add" title="Tab mới (Ctrl+T)"><svg class="ic"><use href="#i-plus"/></svg></button>
    <div class="win">
      <button id="update" class="on" hidden>Cập nhật</button>
      <button id="pin" title="Luôn nằm trên cùng"><svg class="ic"><use href="#i-pin"/></svg></button>
      <button id="more" class="mbtn" title="Thêm"><svg class="ic"><use href="#i-more"/></svg></button>
      <button id="min" title="Thu nhỏ"><svg class="ic"><use href="#i-minimize"/></svg></button>
      <button id="max" title="Phóng to (hoặc nhấp đúp thanh)"><svg class="ic"><use href="#i-maximize"/></svg></button>
      <button id="close" title="Ẩn xuống khay (Ctrl+Shift+Space để mở lại)"><svg class="ic"><use href="#i-x"/></svg></button>
    </div>
  </div>
  <div id="nav">
    <button id="back" title="Lùi (Alt+←)" disabled><svg class="ic"><use href="#i-back"/></svg></button>
    <button id="fwd" title="Tới (Alt+→)" disabled><svg class="ic"><use href="#i-forward"/></svg></button>
    <button id="reload" title="Tải lại (F5)"><svg class="ic"><use href="#i-reload"/></svg></button>
    <div class="omni">
      <input id="url" placeholder="Tìm trên Google hoặc nhập URL…" spellcheck="false">
      <button id="zoom" hidden title="Đưa về 100% (Ctrl+0)"></button>
      <button id="pip" hidden title="Ghim video ra góc màn hình (bấm lần nữa để bỏ ghim)"><svg class="ic"><use href="#i-pip"/></svg></button>
      <button id="star" title="Lưu vào thanh dấu trang (Ctrl+D)"><svg class="ic"><use href="#i-star"/></svg></button>
    </div>
  </div>
  <div id="marks"><button id="marksMore" class="mbtn" title="Các dấu trang khác" hidden><svg class="ic"><use href="#i-chevrons"/></svg></button></div>
  <div id="views">
    <div id="empty">Gõ địa chỉ hoặc từ khoá vào ô phía trên, hoặc kéo link thả vào cửa sổ.<br>Nắm chỗ trống trên thanh để di chuyển · kéo mép hoặc góc để đổi kích thước.<br>Ctrl + Shift + Space: ẩn/hiện · Ctrl + Alt + Space: xuyên chuột.</div>
    <div id="find">
      <input id="findIn" placeholder="Tìm trong trang" spellcheck="false">
      <span id="findN"></span>
      <button id="findUp" title="Kết quả trước (Shift+Enter)"><svg class="ic"><use href="#i-up"/></svg></button>
      <button id="findDown" title="Kết quả sau (Enter)"><svg class="ic"><use href="#i-down"/></svg></button>
      <button id="findX" title="Đóng (Esc)"><svg class="ic"><use href="#i-x"/></svg></button>
    </div>
  </div>
</div>
<div id="corner" title="Kéo để đổi kích thước"></div>
<div id="overlay">Thả để mở tab</div>
<div id="shield"></div>
<div id="sug"></div>
<div id="menu"></div>
<div id="ghost"><svg class="ic"><use href="#i-ghost"/></svg>Đang xuyên chuột · Ctrl+Alt+Space để tắt</div>

<script>
const $ = (s) => document.querySelector(s);
const icon = (name, cls = '') => `<svg class="ic ${cls}"><use href="#i-${name}"/></svg>`;
const tabsEl = $('#tabs'), views = $('#views'), urlIn = $('#url'), overlay = $('#overlay'), shield = $('#shield');
const sug = $('#sug'), menu = $('#menu'), marksEl = $('#marks'), marksMore = $('#marksMore'), star = $('#star'), zoomBtn = $('#zoom'), pipBtn = $('#pip');
const findEl = $('#find'), findIn = $('#findIn'), findN = $('#findN');

// Batch localStorage writes to at most once per 0.5s: sites like TikTok/YouTube change the URL constantly while scrolling,
// and writing directly would serialize the whole history (~1000 entries) on every change. Values are read at flush time → always latest
const pending = new Map();
let flushTimer = null;
function store(k, v) {
  pending.set(k, v);
  flushTimer ??= setTimeout(flush, 500);
}
function flush() {
  for (const [k, v] of pending) try { localStorage.setItem(k, JSON.stringify(v)); } catch {}
  pending.clear();
  flushTimer = null;
}
window.addEventListener('beforeunload', flush);
function load(k, d) { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch { return d; } }

let tabs = [], active = null, closed = [];
let hist = load('history', []);  // [{ url, title, n: visit count, t: last visit }]
let marks = load('marks', []);   // [{ url, title, icon }]
let zooms = load('zoom', {});    // { host: zoom factor }
let sugItems = [], sugSel = -1, moving = null, state = {};

const SEARCH = 'https://www.google.com/search?q=';
const ZOOMS = [0.25, 0.33, 0.5, 0.67, 0.75, 0.8, 0.9, 1, 1.1, 1.25, 1.5, 1.75, 2, 2.5, 3];

function norm(u) {
  u = (u || '').trim();
  if (!u) return null;
  if (/^[a-z]:[\\/]/i.test(u)) return 'file:///' + u.replace(/\\/g, '/');
  if (/^[a-z][a-z0-9+.-]*:/i.test(u)) return u;

    '-',
    { label: 'Xoá lịch sử duyệt web', icon: 'trash', run: () => { if (confirm('Xoá toàn bộ lịch sử duyệt web?')) { hist = []; store('history', hist); } } },
    { label: 'Thoát hẳn', icon: 'power', run: () => dock.quit() },
  ];
});

// ---------- Buttons & shortcuts ----------
$('#add').onclick = newTab;
$('#back').onclick = () => { active?.ready && active.wv.canGoBack() && active.wv.goBack(); focusPage(); };
$('#fwd').onclick = () => { active?.ready && active.wv.canGoForward() && active.wv.goForward(); focusPage(); };
$('#reload').onclick = () => { active?.ready && active.wv.reload(); focusPage(); };
$('#pin').onclick = () => dock.pin();
$('#min').onclick = () => dock.minimize();
$('#max').onclick = () => dock.maximize();
$('#close').onclick = () => dock.hide();
dock.onState((s) => {
  state = s;
  $('#pin').classList.toggle('on', s.pinned);
  $('#max').innerHTML = icon(s.maximized ? 'restore' : 'maximize');
  $('#max').title = (s.maximized ? 'Thu lại' : 'Phóng to') + ' (hoặc nhấp đúp thanh)';
  document.body.classList.toggle('ghost', s.ghost);
});
dock.onOpenTab((url) => openTab(url));
dock.onUpdate((v) => {
  $('#update').hidden = false;
  $('#update').title = `Đã tải bản ${v} · bấm để khởi động lại và cập nhật`;
});
$('#update').onclick = () => dock.installUpdate();
dock.onAudio((id, audible) => {
  const t = tabs.find(x => x.wcId === id);
  if (t) { t.audible = audible; updSound(t); }
});

const keys = {
  newTab,
  closeTab: () => active && close(active),
  reopen: () => closed.length && openTab(closed.pop()),
  focusUrl: () => { urlIn.focus(); urlIn.select(); },
  reload: () => $('#reload').click(),
  hardReload: () => active?.ready && active.wv.reloadIgnoringCache(),
  back: () => $('#back').click(),
  forward: () => $('#fwd').click(),
  nextTab: () => cycle(1),
  prevTab: () => cycle(-1),
  bookmark: () => star.click(),
  find: openFind,
  zoomIn: () => zoom(1),
  zoomOut: () => zoom(-1),
  zoomReset: () => zoom(0),
};
dock.onKey((a) => {
  const n = /^tab(\d)$/.exec(a);
  if (!n) return keys[a]?.();
  const t = n[1] === '9' ? tabs.at(-1) : tabs[n[1] - 1]; // Ctrl+9 = last tab, like Chrome
  if (t) select(t);
});

// Drag & drop links / URLs / files → when dragging into the window, an overlay covers the page to catch the drop
window.addEventListener('dragover', (e) => e.preventDefault());
window.addEventListener('drop', (e) => e.preventDefault());
window.addEventListener('dragenter', (e) => { e.preventDefault(); if (!moving) overlay.classList.add('on'); });
overlay.addEventListener('dragover', (e) => { e.preventDefault(); e.dataTransfer.dropEffect = 'copy'; });
overlay.addEventListener('dragleave', (e) => { if (e.target === overlay) overlay.classList.remove('on'); });
overlay.addEventListener('drop', (e) => {
  e.preventDefault();
  overlay.classList.remove('on');
  const d = e.dataTransfer;
  let u = (d.getData('text/uri-list') || '').split(/\r?\n/).find(l => l && !l.startsWith('#'));
  if (!u) u = d.getData('text/plain');
  if (!u && d.files.length) {
    const p = dock.filePath(d.files[0]);
    if (p) u = 'file:///' + p.replace(/\\/g, '/').replace(/^\/+/, '');
  }
  if (u) openTab(u);
});

// Drag the bottom-right corner to resize (in addition to dragging the window edges)
$('#corner').addEventListener('mousedown', (e) => {
  e.preventDefault();
  shield.classList.add('on');
  dock.resizeStart();
});
const stop = () => { if (shield.classList.contains('on')) { shield.classList.remove('on'); dock.resizeEnd(); } };
shield.addEventListener('mouseup', stop);
window.addEventListener('mouseup', stop);
window.addEventListener('blur', stop);

// Restore bookmarks + tabs from last session
// Zoom used to be keyed by host:port → re-key by hostname (see hostOf)
for (const k of Object.keys(zooms)) {
  const h = hostOf('http://' + k);
  if (h !== k) { zooms[h] ??= zooms[k]; delete zooms[k]; store('zoom', zooms); }
}
renderMarks();
// Only load the active tab's page; others load when clicked (each page = 1 process, loading all at once is heavy)
load('tabs', []).forEach((u) => openTab(u, false, true));
if (tabs.length) select(tabs[load('active', 0)] ?? tabs[0]);
</script>
</body>
</html>
